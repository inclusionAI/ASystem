<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">ASystem technical capability map</title>
  <desc id="desc">Data, training, and evaluation connect through shared state and memory infrastructure.</desc>
