      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#53658a" flood-opacity=".12"/>
    </filter>
  </defs>
  <g fill="none" stroke="#aab8d2" stroke-width="2">
    <path d="M148 120 C238 120 244 210 330 210"/>
    <path d="M148 300 C238 300 244 210 330 210"/>
    <path d="M572 120 C482 120 476 210 390 210"/>
    <path d="M572 300 C482 300 476 210 390 210"/>
  </g>
  <g fill="#7f91b2">
