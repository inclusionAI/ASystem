    <circle cx="482" cy="144" r="4"/><circle cx="482" cy="276" r="4"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <g><rect x="70" y="76" width="156" height="88" rx="16" fill="#fff" stroke="#dfe6f3"/><text x="148" y="114" font-size="13" fill="#72809c">INPUT</text><text x="148" y="138" font-size="18" font-weight="700" fill="#090b10">Data</text></g>
    <g><rect x="70" y="256" width="156" height="88" rx="16" fill="#fff" stroke="#dfe6f3"/><text x="148" y="294" font-size="13" fill="#72809c">OPTIMIZE</text><text x="148" y="318" font-size="18" font-weight="700" fill="#090b10">Training</text></g>
    <g><rect x="494" y="76" width="156" height="88" rx="16" fill="#fff" stroke="#dfe6f3"/><text x="572" y="114" font-size="13" fill="#72809c">MEASURE</text><text x="572" y="138" font-size="18" font-weight="700" fill="#090b10">Evaluation</text></g>
    <g><rect x="494" y="256" width="156" height="88" rx="16" fill="#fff" stroke="#dfe6f3"/><text x="572" y="294" font-size="13" fill="#72809c">RETAIN</text><text x="572" y="318" font-size="18" font-weight="700" fill="#090b10">Memory</text></g>
    <g><rect x="282" y="156" width="156" height="108" rx="54" fill="#090b10"/><text x="360" y="200" font-size="13" fill="#aeb8ca">SHARED CORE</text><text x="360" y="228" font-size="20" font-weight="700" fill="#fff">State</text></g>
